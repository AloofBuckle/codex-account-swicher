[package]
name = "cas-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cas-gui"
path = "src/main.rs"

[dependencies]
cas-core = { path = "../cas-core" }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }
